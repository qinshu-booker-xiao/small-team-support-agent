[project]
name = "small-team-support-agent"
version = "0.1.0"
description = "Multi-persona WTA tennis player support agent built with ADK 2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "google-cloud-firestore>=2.16.0",
    "fastapi>=0.115.8,<1.0.0",
    "uvicorn~=0.34.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "sse-starlette>=3.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
